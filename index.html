<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi Data Pribadi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .search-box { background-color: #fce4d6; padding: 20px; border: 1px solid #a5a5a5; margin-bottom: 15px; }
    </style>
</head>
<body class="p-4">

    <div class="container border p-4 bg-light">
        <h3 class="mb-4">📋 Aplikasi Data Pribadi</h3>

        <div id="monitoringView">
            <div class="search-box">
                <div class="row mb-2">
                    <label class="col-sm-1 col-form-label font-weight-bold">NIK</label>
                    <div class="col-sm-4"><input type="number" id="searchNik" class="form-control form-control-sm"></div>
                </div>
                <div class="row">
                    <label class="col-sm-1 col-form-label">Nama</label>
                    <div class="col-sm-4"><input type="text" id="searchNama" class="form-control form-control-sm"></div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mb-3">
                <button class="btn btn-primary btn-sm px-4" onclick="loadData()">Search</button>
                <button class="btn btn-primary btn-sm px-4" onclick="showForm('add')">Add</button>
            </div>

            <table class="table table-bordered table-striped text-center align-middle bg-white">
                <thead class="table-secondary">
                    <tr>
                        <th>No</th><th>NIK</th><th>Nama Lengkap</th><th>Umur</th><th>Tanggal Lahir</th>
                        <th>Jenis Kelamin</th><th>Alamat</th><th>Negara</th><th>Action</th>
                    </tr>
                </thead>
                <tbody id="apiTableBody">
                    </tbody>
            </table>
        </div>

        <div id="formView" style="display: none;" class="col-md-6">
            <h4 id="formTitle" class="mb-3">Tambah Data Baru</h4>
            <form id="dataForm">
                <div class="mb-3">
                    <label class="form-label">NIK <span class="text-danger">*</span></label>
                    <input type="number" id="nik" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nama Lengkap <span class="text-danger">*</span></label>
                    <input type="text" id="namaLengkap" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label d-block">Jenis Kelamin</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="jenisKelamin" id="jkL" value="Laki-Laki" checked>
                        <label class="form-check-label" for="jkL">Laki-laki</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="jenisKelamin" id="jkP" value="Perempuan">
                        <label class="form-check-label" for="jkP">Perempuan</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tanggal Lahir</label>
                    <input type="date" id="tanggalLhir" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Alamat</label>
                    <textarea id="alamat" class="form-control" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Negara</label>
                    <select id="negara" class="form-select">
                        <option value="">Pilih Negara</option>
                        <option value="Indonesia">Indonesia</option>
                        <option value="Argentina">Argentina</option>
                        <option value="Portugal">Portugal</option>
                        <option value="Rusia">Rusia</option>
                        <option value="Malaysia">Malaysia</option>
                    </select>
                </div>
                <div class="mt-4">
                    <button type="submit" id="btnSubmit" class="btn btn-primary px-4">Simpan</button>
                    <button type="button" class="btn btn-secondary px-4" onclick="hideForm()">Kembali</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "/api/data-pribadi";
        let currentMode = "add";

        $(document).ready(function() {
            loadData();

            // Handle Submit Form (Tambah / Edit)
            $("#dataForm").on("submit", function(e) {
                e.preventDefault();
                
                let payload = {
                    nik: $("#nik").val(),
                    namaLengkap: $("#namaLengkap").val(),
                    jenisKelamin: $("input[name='jenisKelamin']:checked").val(),
                    tanggalLahir: $("#tanggalLhir").val() ? $("#tanggalLhir").val() : null,
                    alamat: $("#alamat").val(),
                    negara: $("#negara").val()
                };

                let type = currentMode === "add" ? "POST" : "PUT";
                let url = currentMode === "add" ? API_URL : API_URL + "/" + payload.nik;

                $.ajax({
                    url: url,
                    type: type,
                    contentType: "application/json",
                    data: JSON.stringify(payload),
                    success: function() {
                        alert("Data berhasil disimpan!");
                        hideForm();
                        loadData();
                    },
                    error: function(err) {
                        alert("Error: " + err.responseText);
                    }
                });
            });
        });

        function loadData() {
            let nik = $("#searchNik").val();
            let nama = $("#searchNama").val();
            
            $.get(API_URL, { nik: nik, nama: nama }, function(data) {
                let rows = "";
                data.forEach((item, index) => {
                    // Format Tanggal ke DD-Mon-YY jika ada
                    let tglFormatted = "-";
                    if(item.tanggalLahir) {
                        let d = new Date(item.tanggalLahir);
                        const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
                        tglFormatted = `${String(d.getDate()).padStart(2, '0')}-${months[d.getMonth()]}-${String(d.getFullYear()).slice(-2)}`;
                    }

                    rows += `<tr>
                        <td>${index + 1}</td>
                        <td>${item.nik}</td>
                        <td>${item.namaLengkap}</td>
                        <td>${item.umur}</td>
                        <td>${tglFormatted}</td>
                        <td>${item.jenisKelamin || '-'}</td>
                        <td>${item.alamat || '-'}</td>
                        <td>${item.negara || '-'}</td>
                        <td>
                            <a href="#" class="text-warning text-decoration-none fw-bold me-2" onclick="viewData(${item.nik}, 'detail')">Detail</a>
                            <a href="#" class="text-primary text-decoration-none fw-bold me-2" onclick="viewData(${item.nik}, 'edit')">Edit</a>
                            <a href="#" class="text-danger text-decoration-none fw-bold" onclick="deleteData(${item.nik}, '${item.namaLengkap}')">Delete</a>
                        </td>
                    </tr>`;
                });
                $("#apiTableBody").html(rows);
            });
        }

        function showForm(mode) {
            currentMode = mode;
            $("#monitoringView").hide();
            $("#formView").show();
            $("#dataForm")[0].reset();
            $("#nik").prop("disabled", false);
            $("#btnSubmit").show();
            
            // Set input state default enable
            $("#dataForm input, #dataForm textarea, #dataForm select").prop("disabled", false);

            if(mode === 'add') {
                $("#formTitle").text("Tambah Data Baru");
                $("#btnSubmit").text("Simpan");
            }
        }

        function hideForm() {
            $("#formView").hide();
            $("#monitoringView").show();
        }

        function viewData(nik, mode) {
            showForm(mode);
            $("#nik").prop("disabled", true); // NIK tidak boleh diedit karena PK

            $.get(API_URL + "/" + nik, function(data) {
                $("#nik").val(data.nik);
                $("#namaLengkap").val(data.namaLengkap);
                $(`input[name='jenisKelamin'][value='${data.jenisKelamin}']`).prop('checked', true);
                $("#tanggalLhir").val(data.tanggalLahir);
                $("#alamat").val(data.alamat);
                $("#negara").val(data.negara);

                if(mode === 'edit') {
                    $("#formTitle").text("Edit Data Pribadi");
                    $("#btnSubmit").text("Ubah");
                } else if(mode === 'detail') {
                    $("#formTitle").text("Detail Data Pribadi");
                    $("#btnSubmit").hide();
                    // Disable semua field jika mode detail
                    $("#dataForm input, #dataForm textarea, #dataForm select").prop("disabled", true);
                }
            });
        }

        function deleteData(nik, nama) {
            // Sesuai mockup konfirmasi hapus data
            if (confirm(`Anda yakin menghapus data ${nama} ?`)) {
                $.ajax({
                    url: API_URL + "/" + nik,
                    type: "DELETE",
                    success: function() {
                        loadData();
                    }
                });
            }
        }
    </script>
</body>
</html>
